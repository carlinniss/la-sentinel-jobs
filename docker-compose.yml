services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-https://jobs-staging.lasentinel.net}"
      ASSET_URL: "${ASSET_URL:-https://jobs-staging.lasentinel.net}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: openclassify
      DB_USERNAME: openclassify
      DB_PASSWORD: secret
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_DB_SEED: "false"
      BROADSTREET_ENABLED: "${BROADSTREET_ENABLED:-true}"
      BROADSTREET_NETWORK_ID: "${BROADSTREET_NETWORK_ID:-10588}"
      BROADSTREET_PREVIEW: "${BROADSTREET_PREVIEW:-false}"
      BROADSTREET_FLUX_ENABLED: "${BROADSTREET_FLUX_ENABLED:-true}"
      BROADSTREET_ZONE_BILLBOARD: "${BROADSTREET_ZONE_BILLBOARD:-187227}"
      BROADSTREET_ZONE_SOURCE_BODY_SECONDARY: "${BROADSTREET_ZONE_SOURCE_BODY_SECONDARY:-187229}"
      BROADSTREET_ZONE_SOURCE_HEADER_LEFT: "${BROADSTREET_ZONE_SOURCE_HEADER_LEFT:-187225}"
      BROADSTREET_ZONE_SOURCE_HEADER_RIGHT: "${BROADSTREET_ZONE_SOURCE_HEADER_RIGHT:-187226}"
      BROADSTREET_ZONE_LEADERBOARD: "${BROADSTREET_ZONE_LEADERBOARD:-187227}"
      BROADSTREET_ZONE_DISPLAY: "${BROADSTREET_ZONE_DISPLAY:-187228}"
      BROADSTREET_ZONE_SKYSCRAPER: "${BROADSTREET_ZONE_SKYSCRAPER:-187225}"
      BROADSTREET_ZONE_HALF_PAGE: "${BROADSTREET_ZONE_HALF_PAGE:-187226}"
      BROADSTREET_ZONE_INLINE: "${BROADSTREET_ZONE_INLINE:-187229}"
      BROADSTREET_ZONE_CUBE: "${BROADSTREET_ZONE_CUBE:-187228}"
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: openclassify
      MYSQL_USER: openclassify
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
  storage_data:
