services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: /start.sh
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: openclassify
      DB_USERNAME: openclassify
      DB_PASSWORD: secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: "null"
      FILESYSTEM_DISK: public
      MEDIA_DISK: public
      LOCAL_MEDIA_DISK: public
      LIVEWIRE_TEMPORARY_FILE_UPLOAD_DISK: local
    volumes:
      - .:/workspaces/la-sentinel-jobs
      - /workspaces/la-sentinel-jobs/vendor
      - /workspaces/la-sentinel-jobs/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: openclassify
      MYSQL_USER: openclassify
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data_dev:
